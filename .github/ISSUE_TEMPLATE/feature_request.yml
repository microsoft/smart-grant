name: Feature Request
description: Suggest an idea for Smart Grant Request
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who benefits?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe the feature and how it should work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      multiple: true
      options:
        - Frontend (Next.js)
        - Backend (FastAPI / Agent Framework)
        - Agents / AI
        - Live data sources (Grants.gov, NCES, ProPublica)
        - PDF output
        - Auth
        - Deployment / Infra
        - Documentation
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Mockups, links, related issues, etc.
