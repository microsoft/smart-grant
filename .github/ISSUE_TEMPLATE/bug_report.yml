name: Bug Report
description: Something isn't working as expected
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out the form below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: When I click X, Y happens instead of Z.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / Commit
      description: e.g. v2.0.0-beta.1, or commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      multiple: true
      options:
        - Frontend (Next.js)
        - Backend (FastAPI / Agent Framework)
        - Agents / AI
        - Live data sources (Grants.gov, NCES, ProPublica)
        - PDF output
        - Auth
        - Deployment / Infra
        - Documentation
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Node version, Python version, deployment (local / Azure)
      render: markdown
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste relevant logs or attach screenshots.
      render: shell
