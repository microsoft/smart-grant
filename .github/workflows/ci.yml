name: CI

on:
  push:
    # `main` nao aparece aqui de proposito: um push nesse branch dispara o
    # workflow de deploy, que ja chama este arquivo como portao. Se estivesse
    # nos dois lugares, cada push rodaria a suite inteira duas vezes em
    # paralelo, com dois resultados concorrentes para o mesmo commit.
    # Pull requests para main continuam cobertos pelo gatilho abaixo.
    branches-ignore: [main]
  pull_request:
    branches: [main]
  # Permite que o workflow de deploy reaproveite estes mesmos portoes como
  # pre-requisito, em vez de duplicar os passos e correr o risco de os dois
  # arquivos divergirem com o tempo.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Must track the Dockerfile. CI on a different major than the image
          # means a green build never exercised what production runs.
          node-version: "26"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check & build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  backend:
    name: Backend (FastAPI / Agent Framework)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent_framework_backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          # Must track agent_framework_backend/Dockerfile, for the same reason.
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            agent_framework_backend/requirements.txt
            agent_framework_backend/requirements-dev.txt
      - name: Install dependencies
        # As ferramentas de qualidade vivem em requirements-dev.txt, e nao
        # soltas aqui. Antes estavam neste arquivo e em nenhum outro: quem
        # clonava o repositorio e instalava requirements.txt nao conseguia
        # rodar a suite. Fixar as versoes la tambem mantem um unico lugar
        # para atualiza-las.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests
        run: pytest -q

  docker:
    name: Docker build (smoke)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: smart-grant-request-frontend:ci
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./agent_framework_backend
          push: false
          tags: smart-grant-request-backend:ci
